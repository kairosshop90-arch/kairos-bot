<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAIROS - Tienda</title><style>body{font-family:Arial;background:#f5f5f5;margin:0;padding:15px}h1{text-align:center} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px} .card{background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px #0001} .card h3{margin:5px 0;font-size:15px} .precio{font-weight:bold;color:#0a7;font-size:18px} .mn{color:#666;font-size:13px} button{background:#25D366;border:0;padding:10px 14px;border-radius:8px;font-weight:bold;width:100%;margin-top:8px} input,select{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box} #pedido{background:#fff;padding:15px;border-radius:12px;margin-top:15px} .agotado{color:red;font-weight:bold}</style></head>
<body><h1>🛒 KAIROS</h1><p id="tasa" style="text-align:center"></p><div id="catalogo" class="grid">Cargando...</div>
<div id="pedido"><h3>Tu Pedido</h3><div id="carrito">Vacío</div><input id="nombre" placeholder="Nombre Apellido Carnet"><input id="telefono" placeholder="Teléfono 535..."><select id="pago"><option value="MN">Pago en MN</option><option value="USD">Pago en USD</option><option value="EUR">Pago en EUR</option></select><select id="tipo"><option value="mensajeria">Mensajería</option><option value="recogida">Recogida</option></select><input id="direccion" placeholder="Dirección completa"><button onclick="enviar()">ENVIAR PEDIDO POR WHATSAPP</button><p id="msg"></p></div>
<script>
let PRODS=[], CARRO={};
async function cargar(){
  const r=await fetch('/api/catalogo'); const d=await r.json();
  PRODS=d.productos; document.getElementById('tasa').innerText='Tasa hoy: 1 USD = '+d.tasaUSD+' CUP | A1: '+d.tasaA1+' | A2: '+d.tasaA2;
  document.getElementById('catalogo').innerHTML=PRODS.map((p,i)=>`<div class="card"><h3>${p.nombre}</h3><p>Almacén ${p.almacen}</p><div class="precio">${p.precioUSD} USD</div><div class="mn">${p.precioMN.toLocaleString()} MN</div>${p.info?`<p style="font-size:12px">${p.info.slice(0,120)}</p>`:''}${p.agotado?'<div class="agotado">AGOTADO</div>':`<button onclick="add(${i})">Agregar</button>`}</div>`).join('');
}
function add(i){ const p=PRODS[i]; CARRO[p.nombre]=(CARRO[p.nombre]||0)+1; verCarro(); }
function verCarro(){ let t=''; for(let k in CARRO) t+=`${k} x${CARRO[k]}<br>`; document.getElementById('carrito').innerHTML=t||'Vacío'; }
async function enviar(){
  const productos=Object.keys(CARRO).map(k=>({nombre:k,cant:CARRO[k]}));
  if(!productos.length) return alert('Agrega algo primero');
  const body={ cliente:document.getElementById('nombre').value, telefono:document.getElementById('telefono').value, productos, pago:document.getElementById('pago').value, tipo:document.getElementById('tipo').value, direccion:document.getElementById('direccion').value };
  const r=await fetch('/api/pedido',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  document.getElementById('msg').innerText='✅ Pedido enviado! Vale KAIROS-'+d.vale+' Total: '+d.totalMN.toLocaleString()+' MN + Mensajería '+d.mensajeria+' MN. Louis te confirma por WhatsApp.';
  CARRO={}; verCarro();
}
cargar();
</script></body></html>
