<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAIROS - Tienda</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f2f2f2;padding:15px}
header{background:#111;color:#fff;padding:20px;text-align:center;border-radius:12px}
header h1{margin:0;font-size:28px;letter-spacing:3px}
header p{margin:5px 0 0;opacity:.8}
#buscador{width:100%;padding:12px;margin:15px 0;border-radius:10px;border:1px solid #ccc;font-size:16px}
#tasas{text-align:center;background:#fff;padding:10px;border-radius:10px;margin-bottom:15px;font-weight:bold}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card h3{font-size:15px;margin:5px 0;min-height:38px}
.precio{font-size:20px;font-weight:bold;color:#111}
.mn{color:#666;font-size:14px}
button{background:#25D366;color:#fff;border:none;padding:10px 12px;border-radius:8px;width:100%;margin-top:8px;font-weight:bold;cursor:pointer;font-size:14px}
#carrito{position:fixed;bottom:15px;left:15px;right:15px;background:#111;color:#fff;padding:14px;border-radius:12px;display:none;justify-content:space-between;align-items:center}
#carrito b{font-size:16px}
</style>
</head>
<body>
<header><h1>KAIROS</h1><p>Tienda Online - La Habana</p></header>
<input id="buscador" placeholder="🔍 Buscar producto..." oninput="filtrar()">
<div id="tasas">Cargando tasas...</div>
<div id="grid">Cargando productos...</div>
<div id="carrito"><span id="carritoTexto"></span><button style="width:auto;background:#25D366" onclick="pedir()">PEDIR POR WHATSAPP</button></div>
<script>
let datos=null, carrito=[];
async function cargar(){
  let r=await fetch('/api/catalogo'); datos=await r.json();
  document.getElementById('tasas').innerText=`USD: ${datos.tasaUSD} MN | Almacén 1: ${datos.tasaA1} MN | Almacén 2: ${datos.tasaA2} MN`;
  mostrar(datos.productos);
}
function mostrar(lista){
  let grid=document.getElementById('grid');
  if(!lista.length){grid.innerHTML='<p style="grid-column:1/-1;text-align:center">No hay productos todavía. Agrega desde /admin</p>';return;}
  grid.innerHTML=lista.map(p=>{
    let tasa=p.almacen=="2"?datos.tasaA2:datos.tasaA1;
    return `<div class="card"><h3>${p.nombre}</h3><div class="precio">$${p.precioUSD} USD</div><div class="mn">${(p.precioUSD*tasa).toLocaleString()} MN</div><div style="font-size:12px;color:#888">Almacén ${p.almacen}</div><button onclick="agregar('${p.nombre.replace(/'/g,"")}') ">+ AGREGAR</button></div>`
  }).join('');
}
function filtrar(){
  let q=document.getElementById('buscador').value.toLowerCase();
  mostrar(datos.productos.filter(p=>p.nombre.toLowerCase().includes(q)));
}
function agregar(n){carrito.push(n); actualizar();}
function actualizar(){
  let c=document.getElementById('carrito');
  if(!carrito.length){c.style.display='none';return;}
  c.style.display='flex';
  document.getElementById('carritoTexto').innerText=`🛒 ${carrito.length} productos`;
}
function pedir(){
  let msg="Hola KAIROS, quiero pedir:%0A"+carrito.map(x=>"- "+x).join("%0A");
  window.open("https://wa.me/5355555555?text="+msg,"_blank");
}
cargar();
</script>
</body>
</html>
